[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-recommendation-engine"
version = "0.1.0"
description = "Rule-based recommendation engine for real estate market insights"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Júlio Medeiros"}]
dependencies = [
    "semver>=3.0.0",
]

[project.scripts]
rec-engine = "recommendation_engine.__main__:main"
