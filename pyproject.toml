[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-recommendation-engine"
version = "0.1.0"
description = "Rule-based recommendation engine for real estate market insights"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Júlio Medeiros"}]
dependencies = [
    "semver>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["recommendation_engine*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
rec-engine = "recommendation_engine.__main__:main"
