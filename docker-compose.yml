services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=rec_engine
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rec_engine_dev_pw}
      - POSTGRES_DB=rec_engine_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rec_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://rec_engine:${POSTGRES_PASSWORD:-rec_engine_dev_pw}@postgres:5432/rec_engine_dev
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
